<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numerica - Calculadora de Métodos Numéricos</title>
  <link rel="stylesheet" href="style.css">
  
  <script>
    var Module = {
      onRuntimeInitialized: function () {
        console.log("Módulo WebAssembly (C++) listo.");
        // Inicializar grillas por defecto
        if (typeof inicializarGrillas === 'function') inicializarGrillas();
      }
    };
  </script>
  <!-- Carga obligatoria del WASM ANTES de script.js -->
  <script src="core.js" defer></script>
  <script src="script.js" defer></script>
  
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <span class="logo-icon">∑</span>
      <h1 class="logo-title">Numérica</h1>
      <span class="badge">MAC UNAM</span>
    </div>
    <nav class="top-nav">
      <button class="nav-btn active" onclick="mostrarSeccion('unidad2', this)">Unidad 2</button>
      <button class="nav-btn" onclick="mostrarSeccion('unidad3', this)">Unidad 3</button>
      <button class="nav-btn" onclick="mostrarSeccion('unidad4', this)">Unidad 4</button>
      <button class="nav-btn" onclick="mostrarSeccion('unidad5', this)">Unidad 5</button>
      <button class="nav-btn btn-salir" onclick="confirmarSalida()">Salir</button>
    </nav>
  </header>

  <!-- UNIDAD 2: RAÍCES -->
  <div id="unidad2" class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><h3>Unidad 2: Raíces</h3></div>
      <ul class="method-list">
        <li class="method-item active"><a href="#" onclick="seleccionarMetodo('newton', 'unidad2', this)">Newton-Raphson</a></li>
        <li class="method-item"><a href="#" onclick="seleccionarMetodo('biseccion', 'unidad2', this)">Bisección</a></li>
        <li class="method-item"><a href="#" onclick="seleccionarMetodo('secante', 'unidad2', this)">Secante</a></li>
      </ul>
    </aside>
    <main class="content-area">
      <!-- Vistas dinámicas inyectadas por JS o estructuradas aquí. Para mantener tu diseño, aquí unificados los formularios escalares -->
      <section class="card form-card">
        <h3 id="tituloMetodoU2">Método de Newton-Raphson</h3>
        <form id="formU2" onsubmit="event.preventDefault(); ejecutarMetodoU2();">
          <div class="form-group">
            <label>Función $f(x)$:</label>
            <input type="text" id="inputFuncion" placeholder="Ej. x^3 - 2*x - 5" required>
            <div class="math-keyboard" id="mathKeyboard">
              <button type="button" class="key-btn" onclick="insertarSimbolo('x')">x</button>
              <button type="button" class="key-btn" onclick="insertarSimbolo('+')">+</button>
              <button type="button" class="key-btn" onclick="insertarSimbolo('-')">-</button>
              <button type="button" class="key-btn" onclick="insertarSimbolo('*')">*</button>
              <button type="button" class="key-btn" onclick="insertarSimbolo('/')">/</button>
              <button type="button" class="key-btn" onclick="insertarSimbolo('^')">xⁿ</button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-4" id="grpX0"><label>X0 (o Límite Inf):</label><input type="number" id="inputX0" step="any" required></div>
            <div class="form-group col-4" id="grpX1"><label>X1 (o Límite Sup):</label><input type="number" id="inputX1" step="any"></div>
            <div class="form-group col-4"><label>Tolerancia:</label><input type="number" id="inputTol" step="any" value="0.0001" required></div>
            <div class="form-group col-4"><label>Máx Iteraciones:</label><input type="number" id="inputMaxIter" value="100" required></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Calcular</button>
        </form>
      </section>
      
      <section class="card results-card hidden" id="cardResultadosU2">
        <h3>Resultados</h3>
        <div id="alertaErrorU2" class="alert alert-danger hidden"></div>
        <div class="metrics-grid">
          <div class="metric-box"><span class="metric-title">Raíz</span><span class="metric-value" id="valRaizU2">-</span></div>
          <div class="metric-box"><span class="metric-title">Iteraciones</span><span class="metric-value" id="valIterU2">-</span></div>
        </div>
        <div class="table-container">
          <table class="table-custom">
            <thead id="headTablaU2"></thead>
            <tbody id="cuerpoTablaU2"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- UNIDADES 3, 4 y 5: MATRICIALES (Diseño unificado de Grid) -->
  <div id="unidadMatricial" class="main-layout seccion-oculta">
    <aside class="sidebar">
      <div class="sidebar-header"><h3 id="tituloSidebarMatricial">Métodos Matriciales</h3></div>
      <ul class="method-list" id="listaMetodosMatriciales">
        <!-- Inyectado por JS según la unidad -->
      </ul>
    </aside>
    <main class="content-area">
      <section class="card form-card">
        <h3 id="tituloMetodoMatricial">Método</h3>
        <form id="formMatricial" onsubmit="event.preventDefault(); ejecutarMetodoMatricial();">
          <div class="form-row">
            <div class="form-group col-4">
              <label>Dimensión (n x n):</label>
              <input type="number" id="inputN" min="2" max="10" value="3" onchange="generarGrillasMatriciales()" required>
            </div>
            <div class="form-group col-4" id="grpTolMat">
              <label>Tolerancia:</label>
              <input type="number" id="inputTolMat" step="any" value="0.0001">
            </div>
          </div>
          
          <div class="matrix-layout">
            <div class="matrix-section">
              <label>Matriz A</label>
              <div id="gridMatrizA" class="matrix-bracket"></div>
            </div>
            <div class="matrix-section" id="seccionVectorB">
              <label id="labelVectorB">Vector b / x0</label>
              <div id="gridVectorB" class="matrix-bracket"></div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-3">Ejecutar Método</button>
        </form>
      </section>

      <section class="card results-card hidden" id="cardResultadosMatricial">
        <h3>Resultados</h3>
        <div id="alertaErrorMat" class="alert alert-danger hidden"></div>
        <div id="resultadosDinamicosMatriciales"></div>
      </section>
    </main>
  </div>
</body>
</html>
